<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Coordenadas</title>
<style>
  :root{
    --bg:#0b0f14; --grid:#1c2733; --axis:#3a4b5c; --text:#e8eef3;
    --panel-bg:rgba(15,20,26,0.85); --panel-border:#2a3947;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;}
  canvas{display:block;touch-action:none;cursor:grab;}
  canvas.dragging{cursor:grabbing;}

  #titulo{
    position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:14px;
    color:var(--text); font-size:15px; font-weight:600; letter-spacing:.3px;
    background:var(--panel-bg); border:1px solid var(--panel-border);
    padding:8px 14px; border-radius:10px; pointer-events:none;
  }
  #titulo span{display:block;font-weight:400;font-size:11px;color:#8fa3b3;margin-top:2px;}

  #leyenda{
    position:fixed; bottom:calc(14px + env(safe-area-inset-bottom,0px)); left:14px;
    background:var(--panel-bg); border:1px solid var(--panel-border);
    border-radius:10px; padding:10px 14px; color:var(--text); font-size:12px;
    display:flex; flex-direction:column; gap:6px; pointer-events:none;
  }
  #leyenda div{display:flex;align-items:center;gap:8px;}
  #leyenda i{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
  #leyenda i.linea{width:16px;height:3px;border-radius:2px;}

  #tooltip{
    position:fixed; pointer-events:none; z-index:10;
    background:var(--panel-bg); border:1px solid var(--panel-border);
    border-radius:8px; padding:8px 12px; color:var(--text);
    font-size:13px; max-width:240px; opacity:0; transition:opacity .1s;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  #tooltip strong{display:block;margin-bottom:2px;}
  #tooltip small{color:#8fa3b3;}

  @media (max-width:600px){
    #titulo{font-size:12px;padding:6px 10px;top:calc(8px + env(safe-area-inset-top,0px));left:8px;}
    #titulo span{font-size:9px;}
    #leyenda{font-size:10px;padding:7px 10px;gap:4px;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;}
    #leyenda i{width:8px;height:8px;}
    #tooltip{font-size:12px;padding:6px 10px;max-width:180px;}
  }
</style>
</head>

// Estilo por tipo. Para sumar un punto nuevo, solo hace falta ponerle un "tipo"
// de esta lista (o "color"/"r" propios si querés algo puntual y único).
const ESTILOS = {
  hq:      { color: '#ff5252', r: 7 },
  ciudad: { color: '#ffd700', r: 8 },
  outpost: { color: '#ffb300', r: 5 },
  interes: { color: '#00e5ff', r: 6 },
  hqFutura:      { color: '#878787', r: 7 },
  ciudadFutura: { color: '#b8b8b8', r: 8 },
  outpostFuturo: { color: '#909090', r: 5 },
  interesFuturo: { color: '#9e9e9e', r: 6 },
};

function estilo(p){
  const base = ESTILOS[p.tipo] || ESTILOS.interes;
  return { ...base, ...(p.color ? { color: p.color } : {}), ...(p.r ? { r: p.r } : {}) };
}

const porTitulo = Object.fromEntries(puntos.map(p => [p.titulo, p]));

// Para sumar una ruta nueva: nombre, color, y la lista de títulos en orden.
// Los títulos tienen que coincidir EXACTO con los del array "puntos" de arriba.
const RUTAS = [

    color: "#52110d",
    puntos: [
      "Complejo de Minería #0",
      "Granja de Esqueletos",
      ]
}, 
  {

    color: "#38bdf8",
    puntos: [

      "Puesto de Avanzada #16",

},

    ]
  },
  {

    color: "#737373",
    puntos: [

      "¿Puesto de Avanzada #21?",

      "Puesto de Avanzada #13",

      "¿Puesto de Avanzada #24?",
      "Puesto de Avanzada #11",
      "Puesto de Avanzada #10",
      "Puesto de Avanzada #9",
      "¿Puesto de Avanzada #33?",
      ]
},
  {
    nombre: "Ruta futura 4",
    color: "#737373",
    puntos: [
      "¿Puesto de Avanzada #26?",
      "Puesto de Avanzada #14",
      "Aldea Originaria",
      "Puesto de Avanzada #15",
      "¿Puesto de Avanzada #27?",

      "¿Puesto de Avanzada #22?",

},
  {

function distSegmento(px, py, x1, y1, x2, y2){
  const dx = x2-x1, dy = y2-y1;
  const largo2 = dx*dx + dy*dy;
  let t = largo2 === 0 ? 0 : ((px-x1)*dx + (py-y1)*dy) / largo2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t*dx, cy = y1 + t*dy;
  return Math.hypot(px-cx, py-cy);
}

let scale = 0.12;
let offX = 0, offY = 0;
let dragging = false, lastX = 0, lastY = 0, moved = false;
let hovered = null;
let hoveredRuta = null;
let pinchDist = null, pinchScale = null;

function resize(){
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  draw();
}

function worldToScreen(p){
  return {
    x: window.innerWidth/2 + offX + p.x * scale,
    y: window.innerHeight/2 + offY + p.z * scale
  };
}

function niceStep(px){
  const raw = px / scale;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = norm < 2 ? 2 : norm < 5 ? 5 : 10;
  return step * mag;
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  ctx.fillStyle = '#0b0f14';
  ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

  const step = niceStep(110);
  const originX = window.innerWidth/2 + offX;
  const originY = window.innerHeight/2 + offY;

  ctx.font = '11px monospace';
  ctx.strokeStyle = '#1c2733';
  ctx.fillStyle = '#4a5c6d';
  ctx.lineWidth = 1;

  ctx.beginPath();
  for (let gx = (originX % (step*scale)); gx < window.innerWidth; gx += step*scale){
    ctx.moveTo(gx,0); ctx.lineTo(gx, window.innerHeight);
  }
  for (let gy = (originY % (step*scale)); gy < window.innerHeight; gy += step*scale){
    ctx.moveTo(0,gy); ctx.lineTo(window.innerWidth, gy);
  }
  ctx.stroke();

  // Ejes principales
  ctx.strokeStyle = '#3a4b5c';
  ctx.beginPath();
  ctx.moveTo(0, originY); ctx.lineTo(window.innerWidth, originY);
  ctx.moveTo(originX, 0); ctx.lineTo(originX, window.innerHeight);
  ctx.stroke();

  // Rutas
  RUTAS.forEach(r => {
    if (r.nodos.length < 2) return;
    const isHover = hoveredRuta === r;
    ctx.beginPath();
    r.nodos.forEach((p, i) => {
      const {x, y} = worldToScreen(p);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = r.color;
    ctx.lineWidth = isHover ? 4 : 2.5;
    ctx.globalAlpha = isHover ? 1 : 0.55;
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // Puntos
  puntos.forEach(p => {
    const {x, y} = worldToScreen(p);
    if (x < -20 || x > window.innerWidth+20 || y < -20 || y > window.innerHeight+20) return;
    const s = estilo(p);
    const isHover = hovered === p;
    ctx.beginPath();
    ctx.arc(x, y, isHover ? s.r + 3 : s.r, 0, Math.PI*2);
    ctx.fillStyle = s.color;
    ctx.globalAlpha = isHover ? 1 : 0.9;
    ctx.fill();
    if (isHover){
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
}

function encontrarPunto(mx, my){
  for (const p of puntos){
    const {x,y} = worldToScreen(p);
    if (Math.hypot(mx-x, my-y) < 10) return p;
  }
  return null;
}

function encontrarRuta(mx, my){
  for (const r of RUTAS){
    for (let i = 0; i < r.nodos.length - 1; i++){
      const a = worldToScreen(r.nodos[i]);
      const b = worldToScreen(r.nodos[i+1]);
      if (distSegmento(mx, my, a.x, a.y, b.x, b.y) < 7) return r;
    }
  }
  return null;
}

function actualizarHover(mx, my){
  const p = encontrarPunto(mx, my);
  const r = p ? null : encontrarRuta(mx, my);
  const cambio = (p !== hovered) || (r !== hoveredRuta);
  hovered = p; hoveredRuta = r;
  if (cambio) draw();
  return p || r;
}

function textoTooltip(obj){
  if (!obj) return '';
  if (obj.titulo) return `<strong>${obj.titulo}</strong><small>(${obj.x}, ${obj.z})</small>`;
  return `<strong>${obj.nombre}</strong>`;
}

canvas.addEventListener('mousedown', e => {
  dragging = true; moved = false;
  lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add('dragging');
});

window.addEventListener('mousemove', e => {
  if (dragging){
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    offX += dx; offY += dy;
    lastX = e.clientX; lastY = e.clientY;
    tooltip.style.opacity = 0;
    draw();
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const obj = actualizarHover(mx, my);
  if (obj){
    tooltip.innerHTML = textoTooltip(obj);
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
    tooltip.style.opacity = 1;
  } else {
    tooltip.style.opacity = 0;
  }
});

window.addEventListener('mouseup', () => {
  dragging = false;
  canvas.classList.remove('dragging');
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const before = { x: (mx - window.innerWidth/2 - offX)/scale, y: (my - window.innerHeight/2 - offY)/scale };
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  scale = Math.min(2, Math.max(0.01, scale * factor));
  offX = mx - window.innerWidth/2 - before.x*scale;
  offY = my - window.innerHeight/2 - before.y*scale;
  draw();
}, {passive:false});

function distanciaToques(t){
  return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
}

canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1){
    dragging = true; moved = false;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2){
    dragging = false;
    pinchDist = distanciaToques(e.touches);
    pinchScale = scale;
  }
}, {passive:true});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2 && pinchDist){
    const rect = canvas.getBoundingClientRect();
    const midX = (e.touches[0].clientX + e.touches[1].clientX)/2 - rect.left;
    const midY = (e.touches[0].clientY + e.touches[1].clientY)/2 - rect.top;
    const before = { x: (midX - window.innerWidth/2 - offX)/scale, y: (midY - window.innerHeight/2 - offY)/scale };
    const nuevaDist = distanciaToques(e.touches);
    scale = Math.min(2, Math.max(0.01, pinchScale * (nuevaDist / pinchDist)));
    offX = midX - window.innerWidth/2 - before.x*scale;
    offY = midY - window.innerHeight/2 - before.y*scale;
    tooltip.style.opacity = 0;
    draw();
    return;
  }
  if (e.touches.length === 1 && dragging){
    const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    offX += dx; offY += dy;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    tooltip.style.opacity = 0;
    draw();
  }
}, {passive:false});

canvas.addEventListener('touchend', e => {
  pinchDist = null;
  if (!moved && e.changedTouches.length === 1){
    const rect = canvas.getBoundingClientRect();
    const tx = e.changedTouches[0].clientX, ty = e.changedTouches[0].clientY;
    const mx = tx - rect.left, my = ty - rect.top;
    const obj = actualizarHover(mx, my);
    if (obj){
      tooltip.innerHTML = textoTooltip(obj);
      tooltip.style.left = Math.min(tx + 12, window.innerWidth - 190) + 'px';
      tooltip.style.top = Math.max(ty - 60, 8) + 'px';
      tooltip.style.opacity = 1;
    } else {
      tooltip.style.opacity = 0;
      hovered = null; hoveredRuta = null;
      draw();
    }
  }
  dragging = false;
});

if ('ontouchstart' in window){
  document.getElementById('ayuda').textContent = 'Pellizcar: zoom · Arrastrar: mover · Tocar: info';
}

window.addEventListener('resize', resize);
resize();
</script>
