                <h1>Política de Capital</h1>
                <p>La política de Capital, es una ley hecha en el subproyecto Zonda, que define valores fijos a la distribución financiera.
                En mi caso, los valores son bastante inamovibles, ya que yo tengo una polìtica de gastos inflexíble y conservadora.
                </p>

                    <br>

                    <br>
                    <button type="submit">Calcular</button>
					<br>
				</form>
